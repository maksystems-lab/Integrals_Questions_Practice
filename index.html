<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBSE 12th Integrals Practice Questions</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }
  .card {
    background: #222;
    border-radius: 8px;
    padding: 10px;
  }
  .card img {
    width: 100%;
    border-radius: 4px;
    cursor: zoom-in;
  }
  .card p {
    margin: 8px 0 0;
    font-size: 14px;
    color: #aaa;
  }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 999;
    justify-content: center;
    align-items: center;
  }

  .modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 6px;
  }

  .modal.active {
    display: flex;
  }

  .modal-close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: #fff;
    font-size: 40px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>CBSE 12th Integrals — Practice Questions</h1>
<p style="color:#aaa; max-width:600px; margin:0 auto 30px;">
  Free practice questions for CBSE Class 12 Maths, Integrals chapter. Click any question to zoom in.
</p>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <span class="modal-close" id="modalClose">&times;</span>
  <img src="" id="modalImg" alt="Zoomed question">
</div>

<script>
    const total = 219; // change this number if your total is different
    const folder = "PYQs (2018-2024)";
    const grid = document.getElementById("grid");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const modalClose = document.getElementById("modalClose");
  
    for (let i = 1; i <= total; i++) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${folder}/Integrals_Q (${i}).png" alt="Question ${i}" loading="lazy">
        <p>Q${i}</p>
      `;
      grid.appendChild(card);
    }
  
    // Click-to-zoom logic
    grid.addEventListener("click", function(e) {
      if (e.target.tagName === "IMG") {
        modalImg.src = e.target.src;
        modal.classList.add("active");
      }
    });
  
    modalClose.addEventListener("click", function() {
      modal.classList.remove("active");
    });
  
    modal.addEventListener("click", function(e) {
      if (e.target === modal) {
        modal.classList.remove("active");
      }
    });
</script>

<div style="margin-top: 50px;">
    <a href= https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAYAAEjps0lURVQ2WU1ZRUtEWkpLRFkyQ0JHWU1NNUtKRi4u target="_blank" 
       style="color:#4da3ff; text-decoration:none; font-size:16px;">
       📩 Found an issue or have feedback? Click here
    </a>
  </div>

</body>
</html>
