<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CBSE 12th Integrals Practice Questions</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }
  .card {
    background: #222;
    border-radius: 8px;
    padding: 10px;
  }
  .card img {
    width: 100%;
    border-radius: 4px;
  }
  .card p {
    margin: 8px 0 0;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

<h1>CBSE 12th Integrals — Practice Questions</h1>

<div class="grid" id="grid"></div>

<script>
  const total = 219; // change this number if your total is different
  const folder = "PYQs (2018-2024)";
  const grid = document.getElementById("grid");

  for (let i = 1; i <= total; i++) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${folder}/Integrals_Q (${i}).png" alt="Question ${i}" loading="lazy">
      <p>Q${i}</p>
    `;
    grid.appendChild(card);
  }
</script>

</body>
</html>
